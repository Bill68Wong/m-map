<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="32" height="42" role="img" aria-label="起点地图钉">
  <title>M Map · 起点地图钉</title>
  <!-- ============================================================
       起点地图钉（★ v3.1.1 真机反馈 #4 新增）
       背景：此前「起点」是 18px 绿圆点（.nav-map__originpin），而「终点」是地图钉且被误用砖红
         ⇒ 两处语义色整体是反的。本版起：**起点 = 红钉（#B4342A）· 终点 = 绿钉（#0B6E4F）**。
       几何：**完全复用终点钉**（钉头圆心 (16,19) r 9.5；钉尖 (16,40)；两切点 (7.53,23.3)/(24.47,23.3)），
         仅换填充色 + aria-label。
       ⚠️ 本文件经 CSS `background: url("/pin-origin.svg")` 引入 ⇒ 页面 CSS 变量不穿透外部 SVG，
         故颜色写**固定值**（不写 var()）；且**固定色、不随主题**（钉画在地图上，底图不跟主题变）。
         对比度：`#B4342A` on 底图 `#E9ECE8` = 5.09:1 ✓
       ============================================================ -->
  <!-- 白色外圈（地图上把钉从底图里"拔"出来；白底上不可见，无副作用） -->
  <path d="M7.53 23.3 L16 40 L24.47 23.3 A9.5 9.5 0 1 0 7.53 23.3 Z"
        fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
  <!-- 钉身：起点砖红（#B4342A = 项目 --danger 亮色值；「红 = 起点/离开」直觉） -->
  <path d="M7.53 23.3 L16 40 L24.47 23.3 A9.5 9.5 0 1 0 7.53 23.3 Z"
        fill="#B4342A" />
  <!-- 钉头白点：圆心明确落在钉头圆心 -->
  <circle cx="16" cy="19" r="3.8" fill="#fff" />
</svg>
