  <title>M Map · 标志（定稿 · 单色）</title>
  <desc>单色版：全部 currentColor，站点环与钉帽白点以镂空呈现，任意底色可用（印章 / 烫印 / 印刷）。几何＝第四轮 4-2『短钉 · 两站 · 无缝』；左端两站环＝起笔点/折点，右端路线直连澳门绿终点钉。</desc>
  <defs>
    <mask id="mm-hole-mark-mono" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <circle cx="12" cy="48" r="3.9" fill="#000"/><circle cx="30" cy="34" r="3.9" fill="#000"/>
      <circle cx="48" cy="16" r="2.7" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#mm-hole-mark-mono)">
      <path d="M12 48 L12 16 L30 34 L48 16" fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40.29 18.13 L48 46 L55.71 18.13 A8 8 0 1 0 40.29 18.13 Z" fill="currentColor"/>
    </g>
    <circle cx="12" cy="48" r="4.6" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="30" cy="34" r="4.6" fill="none" stroke="currentColor" stroke-width="2.2"/>
