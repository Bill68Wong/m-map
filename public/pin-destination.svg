<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 42" width="32" height="42" role="img" aria-label="终点地图钉">
  <title>M Map · 终点地图钉（重做版）</title>
  <!-- ============================================================
       终点地图钉 · 重做（替换 `.nav-map__destpin` 的「歪扭」CSS 水滴）
       为什么旧版歪：
         旧法用「圆角方块 + rotate(-45deg)」拼水滴 ⇒ ①容器连同 box-shadow 一起转了 45°，
         投影斜着走；②白点用 top:34% + 负 margin 硬凑，旋转后仍偏。
       本版：直接画一条对称的钉形路径（圆头 + 两条切线收到尖），
         零旋转、零偏移 ⇒ 白点心＝钉头圆心，投影永远朝正下方。
       几何：钉头圆心 (16,19) r 9.5；钉尖 (16,40)；两切点 (7.53,23.3)/(24.47,23.3)。
       ============================================================ -->
  <!-- 白色外圈（地图上把钉从底图里"拔"出来；白底上不可见，无副作用） -->
  <path d="M7.53 23.3 L16 40 L24.47 23.3 A9.5 9.5 0 1 0 7.53 23.3 Z"
        fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
  <!-- 钉身
       ★ v3.1.1 #4：**终点钉 = 澳门绿 `#0b6e4f`**（= logo 那个绿 / `--brand-pin` 亮色值）。
       ⚠️ 本文件经页面 CSS `background: url("/pin-destination.svg")` 引入 ⇒
          **页面 CSS 变量不穿透外部 SVG**，`var()` 永远取兜底值 ⇒ 必须改这里的值（改页面 Token 无效）。
       ⚠️ 固定色、**不随主题**：钉画在地图上，底图不跟主题变；若跟 `--brand-pin` 走，深色下会变
          `#6dd58c`，在浅色底图上对比度只剩 1.53:1（几乎看不见）。 -->
  <path d="M7.53 23.3 L16 40 L24.47 23.3 A9.5 9.5 0 1 0 7.53 23.3 Z"
        fill="var(--pin-dest, #0b6e4f)" />
  <!-- 钉头白点：圆心明确落在钉头圆心 -->
  <circle cx="16" cy="19" r="3.8" fill="#fff" />
</svg>
