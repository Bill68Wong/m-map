<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" width="300" height="96" role="img" aria-label="M Map 标志与字标横排组合">
  <title>M Map · 方案 1「路线钉」横排组合</title>
  <!-- ============================================================
       横排组合（mark + wordmark）
       字标用品牌字体 Barlow（项目 --font-display），中文副行用 Noto Sans SC。
       注意：独立打开本文件时若本机未装 Barlow 会回退到系统无衬线；
          在 preview.html 里（已 @import Barlow）为设计意图的准确呈现。
       ============================================================ -->
  <g transform="translate(6 10) scale(1.0)">
    <g fill="none" stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
       stroke-linecap="round" stroke-linejoin="round">
      <polyline points="12,49 12,17 30,35 48,17 48,28" />
    </g>
    <path d="M40.83 34.55 L48 49 L55.17 34.55 A8 8 0 1 0 40.83 34.55 Z"
          fill="var(--brand-green,#0b6e4f)" />
  </g>
  <text x="88" y="56"
        font-family="Barlow, 'Noto Sans SC', system-ui, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-0.015em"
        fill="var(--fg,#0f1720)">M Map</text>
  <text x="90" y="79"
        font-family="Barlow, 'Noto Sans SC', system-ui, sans-serif"
        font-size="13" font-weight="400" letter-spacing="0.02em"
        fill="var(--muted,#5a6472)">澳门公交 · 实时导航</text>
</svg>
