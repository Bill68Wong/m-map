<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M Map 标志：一条路线画出字母 M，末端落一枚终点地图钉">
  <title>M Map · 方案 1「路线钉」</title>
  <!-- ============================================================
       方案 1 · 路线钉（Route-Pin）
       M = 一条连续的导航路线（青花蓝）；收笔处立一枚澳门绿地图钉（终点）。
       钉尖落在 M 的右下脚，与左脚齐平 —— 路线"走"到目的地并钉住。
       颜色全部走 Token（--accent / --brand-green），括号内为独立文件回退值。
       ============================================================ -->
  <g fill="none" stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 起笔竖 → v → 竖（一笔到顶右，随后交给钉） -->
    <polyline points="12,49 12,17 30,35 48,17 48,28" />
  </g>
  <!-- 终点：地图钉（钉尖 = 右下脚 y 49，与左脚齐平） -->
  <path d="M40.83 34.55 L48 49 L55.17 34.55 A8 8 0 1 0 40.83 34.55 Z"
        fill="var(--brand-green,#0b6e4f)" />
</svg>
