<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M Map 应用图标：青花蓝圆角方牌，白色路线 M，末端澳门绿终点钉">
  <title>M Map · 方案 3「站牌徽章」（深色版）</title>
  <!-- ============================================================
       方案 3 · 站牌徽章（Badge）· 深色版
       把标志装进一块圆角方牌 —— App 图标 / favicon / 头像 / 页眉位。
       牌面青花蓝；路线改白色（蓝底上蓝线不可见）；终点钉用白色描边与牌面分离。
       ============================================================ -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="var(--accent,#1b4d8f)" />
  <g transform="translate(-0.5 0.5)">
    <g fill="none" stroke="#fff" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15,46 15,19 30,34 45,19 45,28" />
    </g>
    <!-- 终点钉：白环 + 澳门绿填充 -->
    <path d="M38.81 34.27 L45 46 L51.19 34.27 A7 7 0 1 0 38.81 34.27 Z"
          fill="none" stroke="#fff" stroke-width="2.6" />
    <path d="M38.81 34.27 L45 46 L51.19 34.27 A7 7 0 1 0 38.81 34.27 Z"
          fill="var(--brand-green,#0b6e4f)" />
  </g>
</svg>
