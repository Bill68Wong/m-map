<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="M Map 标志第三轮·短钉版：青花蓝路线走成字母 M，左侧两个站点，右端路线收住、与绿色终点钉之间留一道缝，钉尖停在 M 左脚之上">
  <title>M Map · 第三轮 A-短 · 留缝 · 两站</title>
  <!-- ============================================================
       第三轮 A-短（Pin-Stroke · 留缝 · 短尖 · 两站）
       与「A-长」唯一差别：③ 钉尖只到 y=46，比 M 左脚底（起点站环外缘 y≈53.7）高约 7.7 单位。
       其余全部一致（去箭头 / 留缝 3.6 单位 / 两站）。用于与 A-长 并排比较钉长。
       ============================================================ -->
  <!-- 路线（青花蓝）：右端在缝前收住 -->
  <path d="M12 48 L12 16 L30 34 L37.5 26.5" fill="none"
        stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- 站点环 ×2 -->
  <circle cx="12" cy="48" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <circle cx="30" cy="34" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <!-- 终点钉：钉尖 y=46（短于左脚）-->
  <path d="M40.29 18.13 L48 46 L55.71 18.13 A8 8 0 1 0 40.29 18.13 Z" fill="var(--brand-green,#0b6e4f)" />
  <circle cx="48" cy="16" r="2.7" fill="var(--surface,#fff)" />
</svg>
