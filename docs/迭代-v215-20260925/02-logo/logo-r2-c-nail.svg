<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="M Map 标志备选：一枚细长的澳门绿钉垂直穿过字母 M 的右端，钉帽在折点上方，钉尖扎入基线之下">
  <title>M Map · 第二轮 备选 C「钉穿 M」</title>
  <!-- ============================================================
       备选 C · 钉穿 M（Nail-through）  —— 讨论向
       换个读法：不是「笔画变成钉」，而是「一枚钉把 M 钉住了」。
             一枚细长的绿色钉自上而下穿过 M 的右端：钉帽（带白孔的垫圈）在折点之上，
             钉身比笔画更细更长，钉尖扎到基线以下 —— 物理上就是「钉住」的字面表达。
       代价：右竖不再是路线（少了 B 的「一根线到底」），换来最强的「钉住」动作感。
       左侧路线语言与 A / B 一致（站点环 ×2 + 方向箭头）。颜色全部走 Token。
       ============================================================ -->
  <!-- 路线（青花蓝）-->
  <path d="M12 48 L12 16 L30 34 L48 16" fill="none"
        stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- 站点环 ×2 -->
  <circle cx="12" cy="48" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <circle cx="30" cy="34" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <!-- 方向箭头（白色负形）-->
  <path d="M15.06 23.87 L21 25 L19.87 19.06" fill="none"
        stroke="var(--surface,#fff)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 钉身（比笔画更细）：自折点穿下，收尖到基线之下 -->
  <path d="M45.6 13 L45.6 50 L48 56 L50.4 50 L50.4 13 Z" fill="var(--brand-green,#0b6e4f)" />
  <!-- 钉帽＝带白孔的垫圈，悬在折点之上 -->
  <circle cx="48" cy="12" r="5.6" fill="var(--surface,#fff)" stroke="var(--brand-green,#0b6e4f)" stroke-width="2.6" />
  <circle cx="48" cy="12" r="1.9" fill="var(--brand-green,#0b6e4f)" />
</svg>
