<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="M Map 标志第三轮·长钉版：青花蓝路线走成字母 M，左侧两个站点，右端路线收住、与绿色终点钉之间留一道缝，钉尖落到 M 左脚之下">
  <title>M Map · 第三轮 A-长 · 留缝 · 两站（主推）</title>
  <!-- ============================================================
       第三轮 A-长（Pin-Stroke · 留缝 · 长尖 · 两站）
       ── 基于第二轮 A「收笔即钉」按用户四条意见修订 ──
       ① 去箭头：删掉左竖上的白色方向箭头（用户不要箭头）。
       ② 留缝：路线右端收住在 (37.5,26.5)，不再顶到钉帽；与钉帽圆边
               留出约 3.6 单位（≈标志宽 6%）的缝 —— 「路线到站、钉在那一侧立着」，
               层次分明，但缝控在 6% 内，读起来仍是一枚钉住地图的钉。
       ③ 长尖：钉尖落到 y=58，比 M 左脚底（起点站环外缘 y≈53.7）低约 4.3 单位。
       ④ 两站：起点站环 (12,48) + 换乘站环 (30,34)。
       钉形仍为「圆头 + 两条切线收到尖」，钉帽圆心 (48,16)、半径 8，白孔在圆心。
       颜色全部走 Token（accent / brand-green / surface），括号内为独立打开的回退值。
       ============================================================ -->
  <!-- ① 路线（青花蓝）：左竖 → 中折 → 右上折；右端在缝前收住（去箭头） -->
  <path d="M12 48 L12 16 L30 34 L37.5 26.5" fill="none"
        stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- ④ 站点环 ×2（起点 / 换乘）-->
  <circle cx="12" cy="48" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <circle cx="30" cy="34" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <!-- ③ 终点钉（澳门绿）：钉帽圆心 (48,16) R=8，钉尖 y=58（长于左脚）-->
  <path d="M40.15 17.52 L48 58 L55.85 17.52 A8 8 0 1 0 40.15 17.52 Z" fill="var(--brand-green,#0b6e4f)" />
  <circle cx="48" cy="16" r="2.7" fill="var(--surface,#fff)" />
</svg>
