<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="M Map 标志：一条青花蓝路线走出字母 M，沿途设站点，右竖起笔处自然长成澳门绿终点钉">
  <title>M Map · 第二轮 A「收笔即钉」</title>
  <!-- ============================================================
       A · 收笔即钉（Pin-Stroke）
       核心：M 的右竖不再单独画一笔，而是这一竖「本身」就是一整枚终点钉 ——
             钉帽（含白孔）落在右上折点，钉身即该竖，钉尖穿过基线扎进「地图」。
             路线从右下脚走到右上折点后，笔画直接变身为钉：同一个笔画的两种身份，
             而不是「路线 + 旁边放一枚钉」。
       左侧路线语言：两个站点环（起点 / 换乘）+ 一枚白色方向箭头（沿线指向终点）。
       颜色全部走 Token（accent / brand-green / surface），括号内为独立打开时的回退值。
       ============================================================ -->
  <!-- 路线（青花蓝）：左竖 → 中折 → 右上折；右下竖交给钉 -->
  <path d="M12 48 L12 16 L30 34 L48 16" fill="none"
        stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- 站点环 ×2（节点＝站点样式）-->
  <circle cx="12" cy="48" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <circle cx="30" cy="34" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <!-- 方向箭头（白色负形，沿线路指向前进方向）-->
  <path d="M15.06 23.87 L21 25 L19.87 19.06" fill="none"
        stroke="var(--surface,#fff)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 终点钉＝右竖本身：钉帽落在右上折点 (48,16)，钉尖穿到基线以下 (48,52) -->
  <path d="M40.2 17.78 L48 52 L55.8 17.78 A8 8 0 1 0 40.2 17.78 Z" fill="var(--brand-green,#0b6e4f)" />
  <circle cx="48" cy="16" r="2.7" fill="var(--surface,#fff)" />
</svg>
