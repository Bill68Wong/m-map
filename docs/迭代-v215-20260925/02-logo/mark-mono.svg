<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M Map 单色标志：路线 M 与末端终点钉，同一墨色">
  <title>M Map · 单色版（盖章 / 印制 / 禁用彩色的场景）</title>
  <!-- 单色版：路线与钉同墨。用 currentColor ⇒ 放在任何文字色环境里自动跟随。 -->
