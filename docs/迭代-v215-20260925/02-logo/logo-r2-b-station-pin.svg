<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"
     aria-label="M Map 标志：路线沿途设站点，终点站环即钉帽，出站化为向下的绿色箭头状钉尖">
  <title>M Map · 第二轮 B「站环成钉」</title>
  <!-- ============================================================
       B · 站环成钉（Station-Ring Pin）
       核心构思：钉不是外来形状，而是「用路线自己的词汇拼出来的」——
             把「站点环」当钉帽、把「方向箭头」当钉身与钉尖，
             两者叠在一起，得到的形状恰好就是一整枚地图钉。
       落地：路线走到右上折点进入「终点站环」（空心环＝钉帽）；
             环下生出一枚与路线同宽的绿色向下箭头，箭头即钉身，箭头尖端即钉尖。
       ⇒ 全程只有一种视觉语言：路线 / 站点 / 箭头；钉是它们的自然结果。
       左侧同样：站点环 ×2 + 白色方向箭头。颜色全部走 Token。
       ============================================================ -->
  <!-- 路线（青花蓝）：左竖 → 中折 → 右上折，止于右上折点（进入终点站环）-->
  <path d="M12 48 L12 16 L30 34 L48 16" fill="none"
        stroke="var(--accent,#1b4d8f)" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" />
  <!-- 站点环 ×2 -->
  <circle cx="12" cy="48" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <circle cx="30" cy="34" r="4.6" fill="var(--surface,#fff)" stroke="var(--accent,#1b4d8f)" stroke-width="2.2" />
  <!-- 方向箭头（白色负形）-->
  <path d="M15.06 23.87 L21 25 L19.87 19.06" fill="none"
        stroke="var(--surface,#fff)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 钉身＋钉尖＝绿色向下箭头（与路线同宽 6.5，出站后直落、收尖）-->
  <path d="M44.75 16 L44.75 44 L41.4 44 L48 52 L54.6 44 L51.25 44 L51.25 16 Z"
        fill="var(--brand-green,#0b6e4f)" />
  <!-- 终点站环＝钉帽（盖在钉身顶端，空心环与左侧站点环同语汇）-->
  <circle cx="48" cy="16" r="6.5" fill="var(--surface,#fff)" stroke="var(--brand-green,#0b6e4f)" stroke-width="2.6" />
</svg>
