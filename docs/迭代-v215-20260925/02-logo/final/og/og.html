<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>M Map · OG 分享卡（1200×630 · 固定深底）</title>
    <meta name="viewport" content="width=1200, height=630, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
         M Map · OG 分享卡 · Token 层
         —— 取值 = src/app/globals.css 深色块（@media prefers-color-scheme: dark）
            + tokens-brand.css 的「固定深底」组（--brand-*-on-dark）。
         本卡是「固定深底」资产（分享卡永远深底，不随站点主题漂移），
         故把深色取值**就地钉死**在本 :root 里，不写 @media。
         组件规则一律引 var(--token)，不出现裸 hex。
         ===================================================================== */
      :root {
        /* 表面（globals.css §深色） */
        --bg: #111318; /* 板底 */
        --surface: #1c1e24; /* 站牌卡面 */

        /* 前景（globals.css §深色） */
        --fg: #e2e2e9;
        --fg-2: #c4c6d0;
        --meta: #a9adb8;

        /* 描边 */
        --border: rgba(226, 226, 233, 0.12);

        /* 品牌（tokens-brand.css · 固定深底组，永远亮色） */
        --brand-route-on-dark: #a8c7fa; /* 青花蓝 → 亮蓝 */
        --brand-pin-on-dark: #6dd58c; /* 澳门绿 → 亮绿 */

        /* 字体（globals.css） */
        --font-display: "Barlow", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
        --font-body: "Barlow", "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
        --font-mono: "JetBrains Mono", "Barlow", monospace;

        /* 圆角（globals.css · 上限 14px） */
        --radius-sheet: 14px;
        --radius-chip: 6px;

        /* 间距（4px 网格 · 取自 --space-* 档位） */
        --pad-board: 64px; /* 板 → 卡 的四周留白（= --space-10） */
        --pad-card: 56px; /* 卡内距 */
        --gap-col: 48px; /* 文字列 ↔ 标志列 */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: var(--bg); /* 仅用于「卡外」观察，截图只取 .og，不会入图 */
      }

      /* ── 画布 ───────────────────────────────────────────────────────────── */
      .og {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font-body);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      /* ── 站牌卡（1px 环 · 无投影） ──────────────────────────────────────── */
      .og__card {
        position: absolute;
        inset: var(--pad-board);
        display: flex;
        gap: var(--gap-col);
        padding: var(--pad-card);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sheet);
      }

      /* ── 左列：文 ───────────────────────────────────────────────────────── */
      .og__text {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      /* 品牌锁头：标志 + 字标 + 中文副行 */
      .og__lockup {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .og__lockup svg {
        display: block;
        width: 44px;
        height: 44px;
        flex: none;
      }
      .og__wordmark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 32px;
        line-height: 32px; /* 整数行高：消子像素取整，卡面像素级可复现 */
        letter-spacing: -0.015em;
        color: var(--fg);
      }
      .og__tagline {
        margin-top: 6px;
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 15px;
        line-height: 21px;
        letter-spacing: 0.02em;
        color: var(--fg-2);
      }

      /* 主标题 */
      .og__h1 {
        margin-top: 44px;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 48px;
        line-height: 55px; /* 2 行 = 110px，整除 */
        letter-spacing: -0.02em;
        color: var(--fg);
      }

      /* 副题 */
      .og__sub {
        margin-top: 18px;
        max-width: 620px;
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 20px;
        line-height: 32px; /* 2 行 = 64px */
        letter-spacing: 0;
        color: var(--fg-2);
      }

      /* 页脚：域名 + 数据来源 */
      .og__foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 14px;
        line-height: 20px;
        letter-spacing: 0.01em;
        color: var(--meta);
      }
      .og__foot-dot {
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: var(--brand-pin-on-dark);
        flex: none;
      }

      /* ── 右列：标志（大） ───────────────────────────────────────────────── */
      .og__mark {
        flex: 0 0 auto;
        align-self: center;
        width: 232px;
        height: 232px;
      }
      .og__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="og" id="og">
      <div class="og__card">
        <div class="og__text">
          <div class="og__lockup">
            <!-- 标志（与 public/brand/mark-dark.svg 同源几何） -->
            <svg viewBox="1.15 0.85 60 60" role="img" aria-label="M Map 标志">
              <defs>
                <mask id="mm-hole-og-lock" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
                  <rect x="0" y="0" width="64" height="64" fill="#fff" />
                  <circle cx="12" cy="48" r="3.9" fill="#000" />
                  <circle cx="30" cy="34" r="3.9" fill="#000" />
                  <circle cx="48" cy="16" r="2.7" fill="#000" />
                </mask>
              </defs>
              <g mask="url(#mm-hole-og-lock)">
                <path
                  class="mm-route"
                  d="M12 48 L12 16 L30 34 L48 16"
                  fill="none"
                  stroke-width="6.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path class="mm-pin" d="M40.29 18.13 L48 46 L55.71 18.13 A8 8 0 1 0 40.29 18.13 Z" />
              </g>
              <circle class="mm-ring" cx="12" cy="48" r="4.6" fill="none" stroke-width="2.2" />
              <circle class="mm-ring" cx="30" cy="34" r="4.6" fill="none" stroke-width="2.2" />
            </svg>
            <div>
              <div class="og__wordmark">M Map</div>
              <div class="og__tagline">澳门公交 · 实时导航</div>
            </div>
          </div>

          <div class="og__h1">全澳巴士 · 轻轨<br />这一程怎么走最快</div>

          <p class="og__sub">
            输入起点与终点，给出步行 + 巴士／轻轨 + 换乘 + 实时到站的门到门方案，按总时长排序。
          </p>

          <div class="og__foot">
            <span>musttoukou.vercel.app</span>
            <span class="og__foot-dot"></span>
            <span>数据来源：澳门交通事务局（DSAT）</span>
          </div>
        </div>

        <!-- 右列：大标志（同源几何，独立 mask id） -->
        <div class="og__mark" aria-hidden="true">
          <svg viewBox="1.15 0.85 60 60" role="img" aria-label="M Map 标志">
            <defs>
              <mask id="mm-hole-og-hero" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
                <rect x="0" y="0" width="64" height="64" fill="#fff" />
                <circle cx="12" cy="48" r="3.9" fill="#000" />
                <circle cx="30" cy="34" r="3.9" fill="#000" />
                <circle cx="48" cy="16" r="2.7" fill="#000" />
              </mask>
            </defs>
            <g mask="url(#mm-hole-og-hero)">
              <path
                class="mm-route"
                d="M12 48 L12 16 L30 34 L48 16"
                fill="none"
                stroke-width="6.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path class="mm-pin" d="M40.29 18.13 L48 46 L55.71 18.13 A8 8 0 1 0 40.29 18.13 Z" />
            </g>
            <circle class="mm-ring" cx="12" cy="48" r="4.6" fill="none" stroke-width="2.2" />
            <circle class="mm-ring" cx="30" cy="34" r="4.6" fill="none" stroke-width="2.2" />
          </svg>
        </div>
      </div>
    </div>

    <!-- 颜色绑定：走 CSS class（不用表现属性里的 var()），跨引擎一致 -->
    <style>
      .mm-route,
      .mm-ring {
        stroke: var(--brand-route-on-dark);
      }
      .mm-pin {
        fill: var(--brand-pin-on-dark);
      }
    </style>
  </body>
</html>
