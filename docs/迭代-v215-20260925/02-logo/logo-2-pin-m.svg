<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="M Map 标志：一枚澳门绿终点地图钉，钉头内嵌白色的字母 M">
  <title>M Map · 方案 2「钉中 M」</title>
  <!-- ============================================================
       方案 2 · 钉中 M（Pin-M）
       把品牌缩成一枚「终点钉」：澳门绿钉身 + 钉头里镂出白色的路线 M。
       剪影就是一个地图钉 ⇒ 在 16px / 圆角头像 / 单色印刷下都立得住。
       钉的造型与地图上的「终点钉」同源（品牌系统一致）。
       ============================================================ -->
  <!-- 钉身 -->
  <path d="M20.07 38.67 L32 52 L43.93 38.67 A16 16 0 1 0 20.07 38.67 Z"
        fill="var(--brand-green,#0b6e4f)" />
  <!-- 钉头内的 M（路线式单笔画） -->
  <polyline points="23,35 23,21 32,29 41,21 41,35"
            fill="none" stroke="#fff" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round" />
</svg>
